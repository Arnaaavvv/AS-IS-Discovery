<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS-IS Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ── Sessions ── -->
  <aside class="sessions">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div>
        <div class="brand-name">AS-IS Discovery</div>
        <div class="brand-sub">DT Simplified</div>
      </div>
    </div>
    <button class="new-session" onclick="newConversation()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New session
    </button>
    <div class="session-list" id="sidebar-list"></div>
  </aside>

  <!-- ── Chat ── -->
  <main class="chat" id="chat">
    <header class="chat-head">
      <div>
        <div class="chat-title" id="chat-title">New session</div>
        <div class="chat-sub" id="session-label"></div>
      </div>
      <button class="board-toggle" onclick="toggleBoard()" aria-label="Show departments">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
        <span id="board-count">Departments</span>
      </button>
      <div class="conn" id="status-dot" title="Waiting for first message"></div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="drop-veil" id="drop-veil" aria-hidden="true">
      <div class="drop-card">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
        <div>Drop documents to file them</div>
      </div>
    </div>

    <div class="composer">
      <div class="attach-row" id="file-preview-row"></div>
      <div class="composer-box">
        <input type="file" id="file-input" multiple hidden onchange="onFilesSelected(this.files)">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach documents" aria-label="Attach documents">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="user-input" rows="1" placeholder="Type a message, or attach a department's documents" onkeydown="handleKeydown(event)" oninput="onInputChange(this)"></textarea>
        <button class="send" id="send-btn" onclick="sendMessage()" disabled aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter to send · Shift+Enter for a new line · drop files anywhere</div>
    </div>
  </main>

  <!-- ── Department board ── -->
  <aside class="board" id="board">
    <div class="board-head">
      <button class="board-close" onclick="toggleBoard()" aria-label="Close">✕</button>
      <div class="board-company" id="board-company">No company yet</div>
      <div class="board-legend">
        <span><i class="sw sw-docs"></i>documents</span>
        <span><i class="sw sw-wait"></i>your answers</span>
        <span><i class="sw sw-done"></i>assessed</span>
      </div>
    </div>
    <div class="board-list" id="board-list"></div>
    <div class="board-foot" id="board-foot"></div>
  </aside>
 
</div>

<script src="script.js"></script>
</body>
</html>
